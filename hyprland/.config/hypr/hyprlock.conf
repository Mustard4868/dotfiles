source = ~/.config/hypr/.conf/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = Noto Sans

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = ~/Pictures/Wallpapers/artemis-ii-window.jpg
  blur_passes = 2
  color = $crust
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = 0, -50
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B"
  color = $text
  font_size = 25
  font_family = $font
  position = 0, -200
  halign = center
  valign = top
}

# FINGERPRINT
label {
  monitor =
  text = $FPRINTPROMPT
  color = $text
  font_size = 14
  font_family = $font
  position = 0, -107
  halign = center
  valign = center
}

# USER AVATAR
#image {
#  monitor =
#  path = ~/.face
#  size = 150
#  border_color = $accent
#  position = 0, 75
#  halign = center
#  valign = center
#}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = rgba(17, 17, 27, 0.8)
  font_color = $text
  fade_on_empty = true
  fade_timeout = 5000
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
